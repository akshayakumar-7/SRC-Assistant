<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="https://upload.wikimedia.org/wikipedia/en/thumb/0/0e/Shanmugha_Arts%2C_Science%2C_Technology_%26_Research_Academy.svg/1280px-Shanmugha_Arts%2C_Science%2C_Technology_%26_Research_Academy.svg.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail">
<title>SRC Campus Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --navy: #16234a;
    --purple: #6c3fc5;
    --blue: #2f6fed;
    --bg: #eef1f8;
    --bot-bubble: #ffffff;
    --user-bubble: linear-gradient(135deg, var(--purple), var(--blue));
    --text-dark: #1b1b1f;
    --text-light: #6b6f80;
}
  body.light-theme {
    --bg: #eef1f8;
    --bot-bubble: #ffffff;
    --text-dark: #1b1b1f;
    --text-light: #6b6f80;
}

body.dark-theme {
    --bg: #0f172a;
    --bot-bubble: #1e293b;
    --text-dark: #ffffff;
    --text-light: #cbd5e1;
}

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .chat-app {
    width: 100%;
    max-width: 420px;
    height: 660px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(20, 20, 50, 0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body.dark-theme .chat-app{
    border: 1px solid rgba(255,255,255,0.3);
  }

  .chat-header {
    background: linear-gradient(120deg, var(--navy), var(--purple));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff;
    padding: 4px;
    object-fit: contain;
  }

  .chat-header .title { font-size: 17px; font-weight: 600; }
  .chat-header .subtitle { font-size: 12px; opacity: 0.85; }

  .chat-messages {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
  }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.45;
    animation: pop 0.15s ease-out;
    white-space: pre-line;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    background: var(--bot-bubble);
    color: var(--text-dark);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .msg.user {
    background: var(--user-bubble);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .typing {
    display: flex;
    gap: 4px;
    align-self: flex-start;
    background: var(--bot-bubble);
    padding: 12px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    background: var(--text-light);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 2.0s; }
  .typing span:nth-child(3) { animation-delay: 2.0s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 18px 12px;
    background: var(--bg);
  }

  .quick-replies button {
    background: #fff;
    border: 1.5px solid var(--purple);
    color: var(--purple);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }

  .quick-replies button:hover {
    background: var(--purple);
    color: #fff;
  }

  .chat-input {
    display: flex;
    padding: 14px;
    gap: 10px;
    border-top: 1px solid #e6e8f0;
    background: #fff;
  }

  .chat-input input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1.5px solid #dfe2ec;
    outline: none;
    font-size: 14px;
  }

  .chat-input input:focus { border-color: var(--purple); }

  .chat-input button {
    background: var(--user-bubble);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }
.msg.bot h1,
.msg.bot h2,
.msg.bot h3 {
    margin-top: 5px;
    margin-bottom: 8px;
}

.msg.bot p {
    margin: 5px 0;
}

.msg.bot ul {
    padding-left: 20px;
}
#themeToggle{
    margin-left:auto;
    background:transparent;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
}
</style>

    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">Hi! I'm the SRC Campus Assistant 👋 Ask me where a room/lab/facility is, a club's contact, or a general question like fees or hostel.</div>
    </div>

    <div class="quick-replies" id="quickReplies">
      <!-- filled automatically below -->
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="e.g. Where is Room 204?" onkeypress="handleKey(event)">
      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

<script>
  /* =====================================================================
     SECTION 1: GENERAL FAQ TOPICS
     Same as before — small talk + general campus questions.
     Add more by copying a block and changing tag/patterns/response.
     ===================================================================== */
  const trainingData = [
    { tag: "greeting", patterns: ["hi", "hello", "hey", "good morning", "good afternoon"],
      response: "Hello! Ask me where a place is, a club contact, or a general question." },
    { tag: "thanks", patterns: ["thanks", "thank you", "thanks a lot", "ok thanks"],
      response: "You're welcome! Anything else you'd like to know?" },
    { tag: "goodbye", patterns: ["bye", "goodbye", "see you", "talk later"],
      response: "Bye! Come back anytime you have a campus question." },
    { tag: "identity", patterns: ["who are you", "what are you", "are you a bot", "are you ai"],
      response: "I'm the SRC Campus Assistant, built by Coders Club to help you find places and answer common questions." },
    { tag: "fees", quickReply: "Fees", patterns: ["fees", "fee payment", "semester fees", "fee due date"],
      response: "Semester fee details and payment are available on the SASTRA student portal under 'Fee Payment'." },
    { tag: "hostel", quickReply: "Hostel", patterns: ["hostel", "hostel fees", "hostel rules", "room allotment"],
      response: "Hostel allotment and rules are handled by the Hostel Office directly." },
    { tag: "timetable", quickReply: "Timetable", patterns: ["timetable", "class schedule", "exam schedule"],
      response: "Class and exam timetables are published on the department notice board and student portal." },
    { tag: "wifi", patterns: ["wifi", "wi-fi", "internet", "network issue"],
      response: "Campus Wi-Fi credentials are provided by IT during orientation. Contact the IT helpdesk for issues." },
    { tag: "transport", patterns: ["bus", "transport", "bus timings", "bus route"],
      response: "Bus routes and timings are available with the Transport Office." }
  ];

  /* =====================================================================
     SECTION 2: CAMPUS DIRECTORY (rooms, labs, facilities)
     ---------------------------------------------------------------------
     Fill this in with your real SRC building data. One object per place.
       name  : what students call it (e.g. "Room 204", "Physics Lab")
       type  : classroom / lab / restroom / facility / sports
       block : building or block name
       floor : which floor
       note  : (optional) any extra direction tip

     Add as many rows as you need — there's no limit. Copy-paste a row
     and edit the values.
     ===================================================================== */
  const directory = [
    { name: "Room 101", type: "classroom", block: "Main Block", floor: "1st Floor", note: "" },
    { name: "Room 204", type: "classroom", block: "CS Block", floor: "2nd Floor", note: "Near the staircase" },
    { name: "Physics Lab", type: "lab", block: "Science Block", floor: "Ground Floor", note: "" },
    { name: "Computer Lab 1", type: "lab", block: "CS Block", floor: "1st Floor", note: "" },
    { name: "Library", type: "facility", block: "Main Block", floor: "Ground Floor", note: "Open 9 AM - 8 PM" },
    { name: "Canteen", type: "facility", block: "Main Block", floor: "Ground Floor", note: "Open 8 AM - 6 PM" },
    { name: "Boys Restroom", type: "restroom", block: "Main Block", floor: "Every floor", note: "" },
    { name: "Girls Restroom", type: "restroom", block: "Main Block", floor: "Every floor", note: "" },
    { name: "Sports Room", type: "sports", block: "Sports Block", floor: "Ground Floor", note: "Equipment issued at counter" }
  ];

  /* =====================================================================
     SECTION 3: CLUB CONTACTS
     Fill this in with real club names and coordinator contact info.
     ===================================================================== */
  const clubs = [
    { name: "Coders Club", contact: "Iswarya V, III BCA C - 7200664748" }
    // Add more clubs here, e.g.:
    // { name: "Sports Club", contact: "Name - phone number" },
  ];

  /* =====================================================================
     SECTION 4: MATCHING ENGINE (you don't need to edit this)
     Turns trainingData / directory / clubs into one combined searchable
     list, then finds the best word-overlap match for whatever the user
     types.
     ===================================================================== */
  function cleanWords(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
  }

  function scoreMatch(userWords, patternWords) {
    let score = 0;
    userWords.forEach(w => { if (patternWords.includes(w)) score++; });
    return score;
  }

  // Build combined pool: [{ patterns: [...], response: "..." }, ...]
  function buildPool() {
    const pool = [];

    trainingData.forEach(topic => {
      pool.push({ patterns: topic.patterns, response: topic.response });
    });

    directory.forEach(place => {
      const patterns = [
        place.name,
        "where is " + place.name,
        "find " + place.name,
        place.type,
        place.block
      ];
      let response = place.name + " is in " + place.block + ", " + place.floor + ".";
      if (place.note) response += " " + place.note;
      pool.push({ patterns, response });
    });

    clubs.forEach(club => {
      const patterns = [club.name, "contact for " + club.name, club.name + " contact"];
      const response = club.name + " contact: " + club.contact;
      pool.push({ patterns, response });
    });

    return pool;
  }

  const pool = buildPool();

  function listClubs() {
    return "Club contacts:\n" + clubs.map(c => "• " + c.name + " — " + c.contact).join("\n");
  }

  function getBotReply(userText) {
    const lower = userText.toLowerCase();

    // special case: full club list
    if (lower.includes("club list") || lower.includes("all clubs") || lower === "clubs") {
      return listClubs();
    }

    const userWords = cleanWords(userText);
    let bestScore = 0;
    let bestResponse = null;

    pool.forEach(entry => {
      entry.patterns.forEach(pattern => {
        const score = scoreMatch(userWords, cleanWords(pattern));
        if (score > bestScore) {
          bestScore = score;
          bestResponse = entry.response;
        }
      });
    });

    if (bestScore === 0) {
      return "I couldn't find that. Try a room/lab name, a facility (canteen, library, restroom, sports room), a club name, or a general question like fees or hostel.";
    }
    return bestResponse;
  }

  /* ===== Chat UI logic (no need to edit below this line) ===== */
  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const quickRepliesBar = document.getElementById('quickReplies');

  const quickButtons = ["Library", "Canteen", "Club Contacts"];
  quickButtons.forEach(label => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = () => sendQuickReply(label === "Club Contacts" ? "club list" : label);
    quickRepliesBar.appendChild(btn);
  });

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;

    // Treat the backend reply as untrusted text.  Markdown is optional, so a
    // missing CDN should not make the chat UI fail while rendering a reply.
    if(sender === 'bot' && typeof marked !== 'undefined'){
        div.innerHTML = marked.parse(String(text));
    } else {
        div.textContent = String(text);
    }

    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

  function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typingIndicator';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
  }

  async function botReplyTo(userText) {

    showTyping();
    try {
      const response = await fetch("/chat", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify({
              message: userText
          })
      });

      const data = await response.json();
      if (!data || typeof data.reply !== 'string') {
        throw new Error('Invalid chat response');
      }
      addMessage(data.reply, 'bot');
    } catch (error) {
      addMessage("I couldn't reach the assistant right now. Please try again.", 'bot');
    } finally {
      removeTyping();
    }
  }
  

  function sendMessage() {
    const text = userInput.value.trim();
    if (text === '') return;
    addMessage(text, 'user');
    userInput.value = '';
    botReplyTo(text);
  }

  function sendQuickReply(text) {
    addMessage(text === "club list" ? "Club Contacts" : text, 'user');
    botReplyTo(text);
  }

  function handleKey(event) {
    if (event.key === 'Enter') sendMessage();
  }
</script>

        localStorage.setItem("theme","light");
        themeBtn.textContent = "🌙";
    }else{
        document.body.classList.remove("light-theme");
        document.body.classList.add("dark-theme");
        localStorage.setItem("theme","dark");
        themeBtn.textContent = "☀️";
    }
});
</script>

</body>
</html>
